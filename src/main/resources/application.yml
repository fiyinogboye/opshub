spring:
  application:
    name: opshub
  datasource:
    url: jdbc:h2:mem:opshub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
server:
  error:
    include-message: never
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/opshub}
    username: ${DATABASE_USERNAME:opshub}
    password: ${DATABASE_PASSWORD:opshub}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
